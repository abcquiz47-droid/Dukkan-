<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:#F5F5F4; font-family: Arial, Helvetica, sans-serif; color:#1c1917; }
  #app { min-height:100vh; padding-bottom:70px; }
  .header { background:#0B1220; color:#fff; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:30; }
  .header-left { display:flex; align-items:center; gap:8px; min-width:0; }
  .header-name { font-weight:bold; font-size:15px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .header-sub { font-size:11px; color:#F59E0B; line-height:1.2; }
  .cloud-btn { background:#1c2536; border:none; padding:8px; border-radius:10px; color:#2dd4bf; }
  .page { padding:16px; }
  .h1 { font-size:20px; font-weight:bold; margin:0 0 2px; }
  .muted { color:#a8a29e; font-size:13px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .card { background:#fff; border:1px solid #e7e5e4; border-radius:16px; box-shadow:0 1px 2px rgba(0,0,0,0.04); }
  .card.pad { padding:14px; }
  .stat-label { font-size:10px; text-transform:uppercase; letter-spacing:.03em; color:#a8a29e; font-weight:700; margin-bottom:4px; }
  .stat-val { font-family:'Courier New',monospace; font-size:19px; font-weight:bold; }
  .good{color:#047857;} .bad{color:#be123c;} .accent{color:#d97706;} .ink{color:#1c1917;}
  .btn { border:none; border-radius:12px; padding:12px 16px; font-weight:600; font-size:14px; cursor:pointer; }
  .btn-primary { background:#0f766e; color:#fff; width:100%; }
  .btn-primary:disabled { background:#d6d3d1; color:#78716c; }
  .btn-ghost { background:#fff; border:1px solid #d6d3d1; color:#44403c; width:100%; }
  .btn-dark { background:#57534e; color:#fff; width:100%; }
  .btn-sm { padding:8px 12px; font-size:13px; }
  .row-between { display:flex; align-items:center; justify-content:space-between; }
  .mt3{margin-top:12px;} .mt2{margin-top:8px;} .mb2{margin-bottom:8px;} .mb3{margin-bottom:12px;}
  .space-y > * + * { margin-top:10px; }

<body>
<div id="app"></div>
<script>
(function(){
"use strict";

// ---------------------------------------------------------------------
// Shop identity & constants
// ---------------------------------------------------------------------
var SHOP = { name: "Shay Zahid Electric Store", place: "Jiwani", address: "Main Bazar, Jiwani", phone: "0332-3327620" };
var BOLT_POINTS = [[13,2],[5,14],[10.5,14],[9,22],[20,9],[12,9]];
var CHART_COLORS = ["#0F766E","#F59E0B","#DC2626","#2563EB","#7C3AED","#059669","#EA580C","#0891B2","#DB2777","#65A30D"];
var STORAGE_KEY = "dukaan_pos_data_v1";
var SYNC_URL_KEY = "dukaan_sync_url";
var SYNC_AUTO_KEY = "dukaan_sync_auto";
var SYNC_LAST_KEY = "dukaan_sync_last";

// ---------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmt(n){ return "Rs " + Math.round(n||0).toLocaleString("en-PK"); }
function dateLabel(iso){
  var d = new Date(iso+"T00:00:00");
  var months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return String(d.getDate()).padStart(2,"0")+"-"+months[d.getMonth()]+"-"+d.getFullYear();
}
function isoWeek(iso){
  var d = new Date(iso+"T00:00:00");
  var target = new Date(d.valueOf());
  var dayNr = (d.getDay()+6)%7;
  target.setDate(target.getDate()-dayNr+3);
  var firstThursday = new Date(target.getFullYear(),0,4);
  var diff = target - firstThursday;
  var week = 1 + Math.round(diff/(7*24*3600*1000));
  return target.getFullYear()+"-W"+String(week).padStart(2,"0");
}
function monthKey(iso){ return iso.slice(0,7); }
function yearKey(iso){ return iso.slice(0,4); }
function escapeHtml(s){
  if (s===undefined || s===null) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function val(id){ var el = document.getElementById(id); return el ? el.value : ""; }
function num(id){ var v = parseFloat(val(id)); return isNaN(v) ? 0 : v; }

// ---------------------------------------------------------------------
// Default data
// ---------------------------------------------------------------------
function defaultDB(){
  return {
    products: [
      { id:"p1", name:"LED Bulb 12W", category:"Lighting", purchasePrice:180, salePrice:220, stock:40, reorderLevel:10 },
      { id:"p2", name:"Copper Wire 90m (1.5mm)", category:"Wiring", purchasePrice:3200, salePrice:3600, stock:12, reorderLevel:4 },
      { id:"p3", name:"Switch Board (2 Switch)", category:"Switches", purchasePrice:220, salePrice:280, stock:25, reorderLevel:8 },
      { id:"p4", name:"MCB 32A", category:"Safety", purchasePrice:350, salePrice:420, stock:15, reorderLevel:5 },
      { id:"p5", name:"Ceiling Fan 56\"", category:"Fans", purchasePrice:3800, salePrice:4300, stock:8, reorderLevel:3 }
    ],
    categories: ["Lighting","Wiring","Switches","Safety","Fans"],
    sales: [],
    stockIns: [],
    heldSales: [],
    customers: [{ id:"c1", name:"Walk-in Regular", phone:"0300-0000000", opening:0 }],
    customerPayments: [],
    suppliers: [{ id:"s1", name:"Electric Wholesale Traders", phone:"0321-0000000", opening:0 }],
    supplierPayments: [],
    incomeExpense: []
  };
}

function migrateDB(d){
  if (!d.categories) d.categories = Array.from(new Set((d.products||[]).map(function(p){ return p.category; }).filter(Boolean)));
  if (!d.heldSales) d.heldSales = [];
  (d.sales||[]).forEach(function(s){ if (!s.time) s.time = "00:00"; if (!s.ts) s.ts = new Date(s.date+"T"+(s.time||"00:00")+":00").getTime() || Date.parse(s.date); });
  (d.customerPayments||[]).forEach(function(p){ if (!p.ts) p.ts = Date.parse(p.date) || Date.now(); });
  (d.supplierPayments||[]).forEach(function(p){ if (!p.ts) p.ts = Date.parse(p.date) || Date.now(); });
  return d;
}

function loadDB(){
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return migrateDB(JSON.parse(raw));
  } catch(e){}
  return defaultDB();
}
function saveDB(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch(e){}
  maybeAutoSync();
}

var db = loadDB();
var ui = {
  tab: "dashboard",
  cart: [],
  billingView: "cart",
  billingQuery: "",
  billingCategory: "Sab",
  customerId: "",
  paymentType: "Cash",
  doneSale: null,
  chartPeriod: "daily",
  reportPeriod: "daily",
  khataMode: "customers",
  khataSelected: null,
  khataPeriod: "yearly",
  dashSubView: null,
  pendingCustName: "",
  pendingCustPhone: "",
  editingProductId: null,
  modal: null,
  modalData: {}
};

// ---------------------------------------------------------------------
// Logo SVG
// ---------------------------------------------------------------------
function logoSVG(size){
  size = size || 40;
  var pts = BOLT_POINTS.map(function(p){ return p.join(","); }).join(" ");
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24">' +
    '<circle cx="12" cy="12" r="11" fill="#0B1220" stroke="#F59E0B" stroke-width="1.4"/>' +
    '<polygon points="'+pts+'" fill="#F59E0B"/></svg>';
}

function nowTime(){ var d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function timeLabel(t){ return t || "--:--"; }

// ---------------------------------------------------------------------
// Derived / balance helpers
// ---------------------------------------------------------------------
function custBalance(c){
  var udhaar = db.sales.filter(function(s){ return s.customerId===c.id && s.paymentType==="Udhaar"; }).reduce(function(a,s){ return a+s.total; },0);
  var paid = db.customerPayments.filter(function(p){ return p.customerId===c.id; }).reduce(function(a,p){ return a+p.amount; },0);
  return c.opening + udhaar - paid;
}
function supBalance(s){
  var purchased = db.stockIns.filter(function(si){ return si.supplierId===s.id && si.paymentType==="Udhaar"; }).reduce(function(a,si){ return a+si.total; },0);
  var paid = db.supplierPayments.filter(function(p){ return p.supplierId===s.id; }).reduce(function(a,p){ return a+p.amount; },0);
  return s.opening + purchased - paid;
}
function custLastActivity(c){
  var ts = 0;
  db.sales.forEach(function(s){ if (s.customerId===c.id && s.paymentType==="Udhaar" && s.ts>ts) ts=s.ts; });
  db.customerPayments.forEach(function(p){ if (p.customerId===c.id && p.ts>ts) ts=p.ts; });
  return ts;
}
function supLastActivity(s){
  var ts = 0;
  db.stockIns.forEach(function(si){ if (si.supplierId===s.id && si.paymentType==="Udhaar" && si.ts>ts) ts=si.ts; });
  db.supplierPayments.forEach(function(p){ if (p.supplierId===s.id && p.ts>ts) ts=p.ts; });
  return ts;
}

// ---------------------------------------------------------------------
// Render: root
// ---------------------------------------------------------------------
function render(){
  var app = document.getElementById("app");
  app.innerHTML = renderHeader() + renderTab() + renderBottomNav() + renderModal();
}

function renderHeader(){
  return '<div class="header">' +
    '<div class="header-left">' + logoSVG(36) +
      '<div><div class="header-name">'+escapeHtml(SHOP.name)+'</div>' +
      '<div class="header-sub">'+escapeHtml(SHOP.place)+' &middot; '+escapeHtml(SHOP.phone)+'</div></div>' +
    '</div>' +
    '<button class="cloud-btn" onclick="App.openModal(\'sync\')">&#9729; Sync</button>' +
  '</div>';
}

function renderBottomNav(){
  var items = [
    ["dashboard","&#8962;","Home"],
    ["billing","&#128722;","Bill"],
    ["inventory","&#128230;","Stock"],
    ["customers","&#128101;","Khata"],
    ["reports","&#128202;","Report"]
  ];
  var html = '<div class="bottomnav">';
  items.forEach(function(it){
    var active = ui.tab===it[0] ? " active" : "";
    html += '<button class="navbtn'+active+'" onclick="App.setTab(\''+it[0]+'\')"><span class="navicon">'+it[1]+'</span>'+it[2]+'</button>';
  });
  html += "</div>";
  return html;
}

function renderTab(){
  switch(ui.tab){
    case "dashboard": return renderDashboard();
    case "billing": return renderBilling();
    case "inventory": return renderInventory();
    case "customers": return renderKhata();
    case "reports": return renderReports();
    default: return "";
  }
}

// ---------------------------------------------------------------------
// Dashboard
// ---------------------------------------------------------------------
function periodMatcher(period, today){
  if (period==="daily") return function(d){ return d===today; };
  if (period==="weekly") return function(d){ return isoWeek(d)===isoWeek(today); };
  if (period==="monthly") return function(d){ return monthKey(d)===monthKey(today); };
  return function(d){ return yearKey(d)===yearKey(today); };
}

function renderDonut(categoryData, total){
  if (categoryData.length===0) return '<p class="muted center pad">Is period mein koi sale nahi hui.</p>';
  var r=60, cx=90, cy=90, sw=24;
  var circumference = 2*Math.PI*r;
  var acc = 0;
  var circles = "";
  categoryData.forEach(function(c,i){
    var frac = total>0 ? c.sale/total : 0;
    var dash = frac*circumference;
    var gap = circumference-dash;
    circles += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+CHART_COLORS[i%CHART_COLORS.length]+'" stroke-width="'+sw+'" stroke-dasharray="'+dash+' '+gap+'" stroke-dashoffset="'+(-acc)+'" transform="rotate(-90 '+cx+' '+cy+')" />';
    acc += dash;
  });
  var legend = categoryData.map(function(c,i){
    return '<div class="legend-row"><span class="legend-left"><span class="dot" style="background:'+CHART_COLORS[i%CHART_COLORS.length]+'"></span>'+escapeHtml(c.name)+'</span><span class="legend-val">'+fmt(c.sale)+'</span></div>';
  }).join("");
  return '<div class="donut-wrap"><svg width="180" height="180" viewBox="0 0 180 180">'+circles+'</svg>' +
    '<div class="donut-center"><div class="donut-total-label">Total</div><div class="donut-total-val">'+fmt(total)+'</div></div></div>' +
    '<div>'+legend+'</div>';
}

function renderDashboard(){
  if (ui.dashSubView==="itemsToday") return renderItemRanking("daily","Aaj Ki Item-Wise Ranking");
  if (ui.dashSubView==="itemsMonth") return renderItemRanking("monthly","Is Mahine Ki Item-Wise Ranking");
  if (ui.dashSubView==="udhaar") return renderUdhaarKhataFull();
  if (ui.dashSubView==="categoryDetail") return renderCategoryDetail();

  var today = todayISO();
  var thisMonth = monthKey(today);
  var thisYear = yearKey(today);
  var todaySales = db.sales.filter(function(s){ return s.date===today; });
  var monthSales = db.sales.filter(function(s){ return monthKey(s.date)===thisMonth; });
  function sum(arr,key){ return arr.reduce(function(a,s){ return a+s[key]; },0); }
  var monthExpense = db.incomeExpense.filter(function(e){ return monthKey(e.date)===thisMonth && e.type==="expense"; }).reduce(function(a,e){ return a+e.amount; },0);
  var monthIncome = db.incomeExpense.filter(function(e){ return monthKey(e.date)===thisMonth && e.type==="income"; }).reduce(function(a,e){ return a+e.amount; },0);
  var monthNet = sum(monthSales,"profit") + monthIncome - monthExpense;
  var lowStock = db.products.filter(function(p){ return p.stock<=p.reorderLevel; });
  var totalCustomerDue = db.customers.reduce(function(a,c){ return a+custBalance(c); },0);
  var totalSupplierPayable = db.suppliers.reduce(function(a,s){ return a+supBalance(s); },0);

  var matcher = periodMatcher(ui.chartPeriod, today);
  var periodSales = db.sales.filter(function(s){ return matcher(s.date); });
  var catMap = {};
  periodSales.forEach(function(s){
    (s.items||[]).forEach(function(it){
      var prod = db.products.filter(function(p){ return p.id===it.productId; })[0];
      var cat = prod ? prod.category : "Other";
      if (!catMap[cat]) catMap[cat] = { name:cat, sale:0 };
      catMap[cat].sale += it.price*it.qty;
    });
  });
  var categoryData = Object.keys(catMap).map(function(k){ return catMap[k]; }).sort(function(a,b){ return b.sale-a.sale; });
  var periodTotal = categoryData.reduce(function(a,c){ return a+c.sale; },0);
  var periodLabels = { daily:"Aaj", weekly:"Is Hafte", monthly:"Is Mahine", yearly:"Is Saal" };

  var html = '<div class="page space-y">';
  html += '<div><div class="h1">Dukaan Dashboard</div><div class="muted">'+dateLabel(today)+'</div></div>';
  html += '<div class="grid2">' +
    statTile("Aaj Ki Sale", fmt(sum(todaySales,"total")), "ink", "App.showDashSub('itemsToday')") +
    statTile("Aaj Ka Profit", fmt(sum(todaySales,"profit")), "good", "App.showDashSub('itemsToday')") +
    statTile("Is Mahine Sale", fmt(sum(monthSales,"total")), "ink", "App.showDashSub('itemsMonth')") +
    statTile("Is Mahine Net Profit", fmt(monthNet), monthNet>=0 ? "good" : "bad", "App.showDashSub('itemsMonth')") +
  '</div>';
  html += '<div class="grid2">' +
    statTile("Grahak Udhaar (Total)", fmt(totalCustomerDue), "accent", "App.showDashSub('udhaar')") +
    statTile("Supplier Ko Dena", fmt(totalSupplierPayable), "bad") +
  '</div>';

  html += '<div class="card pad" style="cursor:pointer;" onclick="App.showDashSub(\'categoryDetail\')">';
  html += '<div class="row-between mb2"><span style="font-weight:bold;font-size:14px;">Category-Wise Sale ('+periodLabels[ui.chartPeriod]+')</span><span class="muted" style="font-size:11px;">Details &rarr;</span></div>';
  html += '<div class="tabs mb3" onclick="event.stopPropagation()">';
  ["daily","weekly","monthly","yearly"].forEach(function(p){
    html += '<button class="'+(ui.chartPeriod===p?"active":"")+'" onclick="App.setChartPeriod(\''+p+'\')">'+p+'</button>';
  });
  html += '</div>';
  html += renderDonut(categoryData, periodTotal);
  html += '</div>';

  if (lowStock.length>0){
    html += '<div class="amber-box">';
    html += '<div style="display:flex;align-items:center;gap:6px;color:#b45309;font-weight:bold;margin-bottom:6px;">&#9888; Kam Stock Warning</div>';
    lowStock.forEach(function(p){
      html += '<div class="low-item"><span>'+escapeHtml(p.name)+'</span><span style="font-family:monospace;font-weight:600;">'+p.stock+' left</span></div>';
    });
    html += '</div>';
  }

  html += '<div class="grid2">' +
    '<button class="btn btn-primary" onclick="App.setTab(\'billing\')">&#128722; Nayi Sale</button>' +
    '<button class="btn btn-ghost" onclick="App.setTab(\'inventory\')">&#128230; Stock Dekhein</button>' +
  '</div>';

  html += "</div>";
  return html;
}

function statTile(label, value, tone, onclick){
  var clickable = onclick ? ' style="cursor:pointer;" onclick="'+onclick+'"' : "";
  return '<div class="card pad"'+clickable+'><div class="stat-label">'+label+'</div><div class="stat-val '+tone+'">'+value+'</div></div>';
}

function backLink(){ return '<a class="icon-link" onclick="App.dashBack()">&larr; Dashboard Par Wapis</a>'; }

function renderItemRanking(period, title){
  var today = todayISO();
  var matcher = periodMatcher(period, today);
  var periodSales = db.sales.filter(function(s){ return matcher(s.date); });
  var itemMap = {};
  periodSales.forEach(function(s){
    (s.items||[]).forEach(function(it){
      if (!itemMap[it.productId]) itemMap[it.productId] = { name:it.name, qty:0, sale:0, profit:0 };
      itemMap[it.productId].qty += it.qty;
      itemMap[it.productId].sale += it.price*it.qty;
      itemMap[it.productId].profit += (it.price-it.cost)*it.qty;
    });
  });
  var rows = Object.keys(itemMap).map(function(k){ return itemMap[k]; }).sort(function(a,b){ return b.profit-a.profit; });

  var html = '<div class="page space-y">';
  html += backLink();
  html += '<div class="h1">'+title+'</div>';
  if (rows.length===0){
    html += '<p class="muted">Is period mein koi sale nahi hui.</p>';
  } else {
    html += '<div class="card" style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:13px;">';
    html += '<tr style="border-bottom:1px solid #e7e5e4;text-align:left;color:#a8a29e;font-size:11px;text-transform:uppercase;">' +

function renderUdhaarKhataFull(){
  var today = todayISO();

  }).filter(function(x){ return x.balance>0; }).sort(function(a,b){ return b.lastTs-a.lastTs; });

function renderCategoryDetail(){
  var today = todayISO();
  var matcher = periodMatcher(ui.chartPeriod, today);
  var periodSales = db.sales.filter(function(s){ return matcher(s.date); });
  var periodLabels = { daily:"Aaj", weekly:"Is Hafte", monthly:"Is Mahine", yearly:"Is Saal" };

  var total = periodSales.reduce(function(a,s){ return a+s.total; },0);
  var profit = periodSales.reduce(function(a,s){ return a+s.profit; },0);

  var custMap = {};
  periodSales.forEach(function(s){
    var key = s.customerName || (s.customerId ? (db.customers.filter(function(c){return c.id===s.customerId;})[0]||{}).name : "") || "Walk-in / Naam Darj Nahi";
    if (!custMap[key]) custMap[key] = 0;
    custMap[key] += s.total;
  });
  var custRows = Object.keys(custMap).map(function(k){ return { name:k, total:custMap[k] }; }).sort(function(a,b){ return b.total-a.total; });

  var itemMap = {};
  periodSales.forEach(function(s){
    (s.items||[]).forEach(function(it){
      if (!itemMap[it.productId]) itemMap[it.productId] = { name:it.name, qty:0, sale:0 };
      itemMap[it.productId].qty += it.qty;
      itemMap[it.productId].sale += it.price*it.qty;
    });
  });
  var itemRows = Object.keys(itemMap).map(function(k){ return itemMap[k]; }).sort(function(a,b){ return b.qty-a.qty; });

  var html = '<div class="page space-y">';
  html += backLink();
  html += '<div class="h1">Sale Ki Poori Tafseel ('+periodLabels[ui.chartPeriod]+')</div>';
  html += '<div class="grid2">' + statTile("Total Sale", fmt(total), "ink") + statTile("Total Profit", fmt(profit), "good") + '</div>';

  html += '<div class="card pad"><div style="font-weight:bold;font-size:14px;margin-bottom:8px;">Customer-Wise Kharidari</div>';
  if (custRows.length===0) html += '<p class="muted">Koi sale nahi hui.</p>';
  custRows.forEach(function(r){
    html += '<div class="low-item"><span>'+escapeHtml(r.name)+'</span><span style="font-family:monospace;font-weight:600;">'+fmt(r.total)+'</span></div>';
  });
  html += '</div>';

  html += '<div class="card pad"><div style="font-weight:bold;font-size:14px;margin-bottom:8px;">Item-Wise Sale (Zyada se Kam)</div>';
  if (itemRows.length===0) html += '<p class="muted">Koi sale nahi hui.</p>';
  itemRows.forEach(function(r,i){
    html += '<div class="low-item"><span>'+(i+1)+'. '+escapeHtml(r.name)+' (Qty: '+r.qty+')</span><span style="font-family:monospace;font-weight:600;">'+fmt(r.sale)+'</span></div>';
  });
  html += '</div>';

  html += "</div>";
  return html;
}

function cartLines(){
  return ui.cart.map(function(i){
    var p = db.products.filter(function(pp){ return pp.id===i.productId; })[0];
    return { productId:i.productId, qty:i.qty, product:p, lineTotal:p.salePrice*i.qty, lineCost:p.purchasePrice*i.qty };
  });
}

function renderProductGrid(){
  var q = ui.billingQuery.toLowerCase();
  var list = db.products.filter(function(p){
    return p.name.toLowerCase().indexOf(q)>=0 && (ui.billingCategory==="Sab" || p.category===ui.billingCategory);
  });
  if (list.length===0) return '<p class="muted" style="grid-column:1/-1;">Koi product nahi mila.</p>';
  return list.map(function(p){
    var disabled = p.stock<=0 ? "disabled" : "";
    return '<button class="prod-card" '+disabled+' onclick="App.addToCart(\''+p.id+'\')">' +
      '<div class="prod-name">'+escapeHtml(p.name)+'</div>' +
      '<div class="prod-cat">&#127991; '+escapeHtml(p.category)+'</div>' +
      '<div class="prod-price">'+fmt(p.salePrice)+'</div>' +
      '<div class="prod-stock">Stock: '+p.stock+'</div>' +
    '</button>';
  }).join("");
}

function renderKhataDetail(){
  var mode = ui.khataMode;
  var list = mode==="customers" ? db.customers : db.suppliers;
  var item = list.filter(function(x){ return x.id===ui.khataSelected; })[0];
  if (!item){ ui.khataSelected=null; return renderKhata(); }
  var bal = mode==="customers" ? custBalance(item) : supBalance(item);
  var history = [];
  if (mode==="customers"){
    db.sales.filter(function(s){ return s.customerId===item.id && s.paymentType==="Udhaar"; }).forEach(function(s){
      history.push({ date:s.date, label:"Udhaar Sale", amount:s.total, positive:true });
    });
    db.customerPayments.filter(function(p){ return p.customerId===item.id; }).forEach(function(p){
      history.push({ date:p.date, label:"Payment Received"+(p.notes?" — "+p.notes:""), amount:p.amount, positive:false });
    });
  } else {
    db.stockIns.filter(function(si){ return si.supplierId===item.id && si.paymentType==="Udhaar"; }).forEach(function(si){
      history.push({ date:si.date, label:"Purchase (Udhaar)", amount:si.total, positive:true });
    });
    db.supplierPayments.filter(function(p){ return p.supplierId===item.id; }).forEach(function(p){
      history.push({ date:p.date, label:"Payment Made"+(p.notes?" — "+p.notes:""), amount:p.amount, positive:false });
    });
  }
  history.sort(function(a,b){ return a.date<b.date?1:-1; });

  var html = '<div class="page space-y">';
  html += '<a class="icon-link" onclick="App.closeKhataDetail()">&larr; Wapis</a>';
  html += '<div class="card pad">';
  html += '<div style="font-weight:bold;font-size:16px;">'+escapeHtml(item.name)+'</div><div class="muted">'+escapeHtml(item.phone||"")+'</div>';
  html += '<div class="row-between mt2"><span class="muted" style="text-transform:uppercase;font-size:11px;font-weight:700;">'+(mode==="customers"?"Balance Due":"Balance Payable")+'</span>';
  html += '<span style="font-family:monospace;font-size:20px;font-weight:bold;color:'+(bal>0?"#be123c":"#047857")+';">'+fmt(bal)+'</span></div></div>';
  html += '<button class="btn btn-primary" onclick="App.openModal(\'payment\')">'+(mode==="customers"?"Payment Wasool Ki":"Payment Ki")+'</button>';
  html += '<div class="muted" style="font-size:11px;font-weight:700;text-transform:uppercase;margin-top:10px;">History</div>';
  if (history.length===0) html += '<p class="muted">Abhi tak koi transaction nahi.</p>';
  history.forEach(function(h){
    html += '<div class="card"><div class="list-item"><div><div style="font-size:13px;font-weight:600;">'+h.label+'</div><div class="muted" style="font-size:11px;">'+dateLabel(h.date)+'</div></div>';
    html += '<span style="font-family:monospace;font-weight:600;color:'+(h.positive?"#be123c":"#047857")+';">'+(h.positive?"+":"-")+fmt(h.amount)+'</span></div></div>';
  });
  html += "</div>";
  return html;
}

// ---------------------------------------------------------------------
// Reports
// ---------------------------------------------------------------------
function renderReports(){
  var keyFn = { daily:function(d){return d;}, weekly:isoWeek, monthly:monthKey, yearly:yearKey }[ui.reportPeriod];
  var map = {};
  function ensure(k){ if (!map[k]) map[k] = { key:k, total:0, cost:0, profit:0, income:0, expense:0 }; return map[k]; }
  db.sales.forEach(function(s){
    var g = ensure(keyFn(s.date));
    g.total += s.total; g.cost += s.cost; g.profit += s.profit;
  });
  db.incomeExpense.forEach(function(e){
    var g = ensure(keyFn(e.date));
    if (e.type==="income") g.income += e.amount; else g.expense += e.amount;
  });
  var groups = Object.keys(map).map(function(k){
    var g = map[k];
    g.net = g.profit + g.income - g.expense;
    return g;
  }).sort(function(a,b){ return a.key<b.key?1:-1; });

  var html = '<div class="page space-y">';
  html += '<div class="row-between"><span class="h1">Reports</span><button class="btn btn-primary btn-sm" style="width:auto;" onclick="App.openModal(\'incomeExpense\')">+ Kharcha/Income</button></div>';
  html += '<div class="tabs">';
  ["daily","weekly","monthly","yearly"].forEach(function(p){
    html += '<button class="'+(ui.reportPeriod===p?"active":"")+'" onclick="App.setReportPeriod(\''+p+'\')">'+p+'</button>';
  });
  html += '</div>';
  if (groups.length===0) html += '<p class="muted">Abhi koi data nahi hai.</p>';
  groups.forEach(function(g){
    html += '<div class="card report-card">';
    html += '<div class="row-between"><span style="font-weight:600;font-size:13px;">'+g.key+'</span>';
    html += '<span style="font-family:monospace;font-weight:bold;color:'+(g.net>=0?"#047857":"#be123c")+';">'+(g.net>=0?"&#9650;":"&#9660;")+' '+fmt(g.net)+'</span></div>';
    html += '<div class="report-grid">' +
      '<div>Sale: <span style="font-family:monospace;color:#1c1917;">'+fmt(g.total)+'</span></div>' +
      '<div>Sale Profit: <span style="font-family:monospace;color:#1c1917;">'+fmt(g.profit)+'</span></div>' +
      '<div>Other Income: <span style="font-family:monospace;color:#1c1917;">'+fmt(g.income)+'</span></div>' +
      '<div>Other Expense: <span style="font-family:monospace;color:#1c1917;">'+fmt(g.expense)+'</span></div>' +
    '</div></div>';
  });
  html += "</div>";
  return html;
}

// ---------------------------------------------------------------------
// Bill JPG export (canvas)
// ---------------------------------------------------------------------
function drawBoltOnCanvas(ctx, cx, cy, scale, color){
  ctx.save();
  ctx.translate(cx-12*scale, cy-12*scale);
  ctx.beginPath();
  BOLT_POINTS.forEach(function(p,i){
    if (i===0) ctx.moveTo(p[0]*scale, p[1]*scale); else ctx.lineTo(p[0]*scale, p[1]*scale);
  });
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();
}

function exportBillJPGCanvas(sale){
  var rowH = 26;
  var width = 640;
  var height = 400 + sale.items.length*rowH + (sale.customerName ? 30 : 0);
  var canvas = document.createElement("canvas");
  canvas.width = width; canvas.height = height;
  var ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,width,height);
  ctx.fillStyle = "#0B1220"; ctx.fillRect(0,0,width,96);
  ctx.beginPath(); ctx.arc(52,48,26,0,Math.PI*2); ctx.fillStyle="#0B1220"; ctx.fill();
  ctx.lineWidth=2.5; ctx.strokeStyle="#F59E0B"; ctx.stroke();
  drawBoltOnCanvas(ctx,52,48,1.5,"#F59E0B");
  ctx.fillStyle="#ffffff"; ctx.font="bold 22px Arial"; ctx.textBaseline="alphabetic";
  ctx.fillText(SHOP.name,92,42);
  ctx.font="13px Arial"; ctx.fillStyle="#F59E0B"; ctx.fillText(SHOP.place,92,62);
  ctx.fillStyle="#CBD5E1"; ctx.font="12px Arial"; ctx.fillText(SHOP.address+"  \u00b7  "+SHOP.phone,92,80);

  var y=130;
  ctx.fillStyle="#111827"; ctx.font="bold 14px Arial";
  ctx.fillText("Bill No: "+sale.invoiceNo,24,y);
  ctx.textAlign="right"; ctx.fillText(dateLabel(sale.date),width-24,y); ctx.textAlign="left";
  y+=22;
  if (sale.customerName){
    ctx.font="13px Arial"; ctx.fillStyle="#374151";
    ctx.fillText("Customer: "+sale.customerName+(sale.customerPhone?"  \u00b7  "+sale.customerPhone:""),24,y);
    y+=24;
  }
  y+=8; ctx.strokeStyle="#E5E7EB"; ctx.beginPath(); ctx.moveTo(24,y); ctx.lineTo(width-24,y); ctx.stroke(); y+=22;
  ctx.font="bold 12px Arial"; ctx.fillStyle="#6B7280"; ctx.fillText("ITEM",24,y);
  ctx.textAlign="right"; ctx.fillText("QTY",width-230,y); ctx.fillText("PRICE",width-140,y); ctx.fillText("TOTAL",width-24,y); ctx.textAlign="left";
  y+=12; ctx.strokeStyle="#E5E7EB"; ctx.beginPath(); ctx.moveTo(24,y); ctx.lineTo(width-24,y); ctx.stroke(); y+=22;
  ctx.font="13px Arial";
  sale.items.forEach(function(it){
    ctx.fillStyle="#111827"; ctx.fillText(it.name,24,y);
    ctx.textAlign="right"; ctx.fillText(String(it.qty),width-230,y); ctx.fillText(fmt(it.price),width-140,y);
    ctx.font="bold 13px Arial"; ctx.fillText(fmt(it.price*it.qty),width-24,y);
    ctx.font="13px Arial"; ctx.textAlign="left";
    y+=rowH;
  });
  y+=6; ctx.strokeStyle="#E5E7EB"; ctx.beginPath(); ctx.moveTo(24,y); ctx.lineTo(width-24,y); ctx.stroke(); y+=30;
  ctx.font="bold 13px Arial"; ctx.fillStyle="#374151"; ctx.fillText("Payment: "+sale.paymentType,24,y);
  ctx.font="bold 20px Arial"; ctx.fillStyle="#0F766E"; ctx.textAlign="right"; ctx.fillText("TOTAL: "+fmt(sale.total),width-24,y); ctx.textAlign="left";
  y+=40; ctx.font="italic 12px Arial"; ctx.fillStyle="#9CA3AF"; ctx.textAlign="center";
  ctx.fillText("Shukriya! Dobara Tashreef Layen \u2014 "+SHOP.phone,width/2,y); ctx.textAlign="left";

  canvas.toBlob(function(blob){
    var file;
    try { file = new File([blob], sale.invoiceNo+".jpg", { type:"image/jpeg" }); } catch(e){ file=null; }
    if (file && navigator.share && navigator.canShare && navigator.canShare({ files:[file] })){
      navigator.share({ files:[file], title: sale.invoiceNo }).catch(function(){ downloadBlob(blob, sale.invoiceNo+".jpg"); });
    } else {
      downloadBlob(blob, sale.invoiceNo+".jpg");
    }
  }, "image/jpeg", 0.95);
}

function downloadBlob(blob, name){
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
}

// ---------------------------------------------------------------------
// Google Sheets sync
// ---------------------------------------------------------------------
function setSyncMsg(msg, ok){
  var el = document.getElementById("syncMsg");
  if (el){ el.textContent = msg; el.style.color = ok===true ? "#047857" : ok===false ? "#e11d48" : "#a8a29e"; }
}

function syncPush(){
  var url = localStorage.getItem(SYNC_URL_KEY);
  if (!url){ setSyncMsg("Pehle Web App URL paste karein.", false); return; }
  setSyncMsg("Google Sheet par bheja ja raha hai...");
  fetch(url, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(db) })
    .then(function(r){ return r.text(); })
    .then(function(text){
      var parsed; try { parsed = JSON.parse(text); } catch(e){ parsed=null; }
      if (!parsed || parsed.status!=="ok") throw new Error("fail");
      var now = new Date().toLocaleString("en-GB");
      localStorage.setItem(SYNC_LAST_KEY, now);
      setSyncMsg("Kamyabi se save ho gaya.", true);
    })
    .catch(function(){ setSyncMsg("Sync fail hua — URL check karein ya dobara try karein.", false); });
}

function syncPull(){
  var url = localStorage.getItem(SYNC_URL_KEY);
  if (!url){ setSyncMsg("Pehle Web App URL paste karein.", false); return; }
  setSyncMsg("Google Sheet se data liya ja raha hai...");
  fetch(url, { method:"GET" })
    .then(function(r){ return r.text(); })
    .then(function(text){
      var parsed = JSON.parse(text);
      if (!parsed || !parsed.products) throw new Error("fail");
      db = parsed;
      saveDB();
      var now = new Date().toLocaleString("en-GB");
      localStorage.setItem(SYNC_LAST_KEY, now);
      setSyncMsg("Local app ab Google Sheet ke data se update ho gayi.", true);
      render();
    })
    .catch(function(){ setSyncMsg("Load fail hua — URL check karein ya dobara try karein.", false); });
}

var autoTimer = null;
function maybeAutoSync(){
  var auto = localStorage.getItem(SYNC_AUTO_KEY)==="1";
  var url = localStorage.getItem(SYNC_URL_KEY);
  if (!auto || !url) return;
  if (autoTimer) clearTimeout(autoTimer);
  autoTimer = setTimeout(function(){
    fetch(url, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(db) }).catch(function(){});
  }, 1200);
}

window.App = {
  setTab: function(t){ ui.tab=t; ui.doneSale=null; ui.khataSelected=null; ui.billingView="cart"; ui.dashSubView=null; render(); },
  showDashSub: function(v){ ui.dashSubView=v; render(); },
  dashBack: function(){ ui.dashSubView=null; render(); },
  setKhataPeriod: function(p){ ui.khataPeriod=p; render(); },
  showBillingView: function(v){ ui.billingView=v; render(); },

  onSearchInput: function(v){ ui.billingQuery=v; document.getElementById("product-grid").innerHTML = renderProductGrid(); },
  setCategoryFilter: function(c){ ui.billingCategory=c; render(); },
  addToCart: function(pid){
    var p = db.products.filter(function(x){ return x.id===pid; })[0];
    if (!p || p.stock<=0) return;
    var existing = ui.cart.filter(function(i){ return i.productId===pid; })[0];
    if (existing){ if (existing.qty<p.stock) existing.qty++; }
    else ui.cart.push({ productId:pid, qty:1 });
    render();
  },
  changeQty: function(pid, delta){
    ui.cart = ui.cart.map(function(i){ return i.productId===pid ? { productId:i.productId, qty:i.qty+delta } : i; }).filter(function(i){ return i.qty>0; });
    render();
  },
  onCustomerFieldInput: function(){ /* read at sale-time; no rerender needed */ },
  pickCustomer: function(id){
    ui.customerId = id;
    var c = db.customers.filter(function(x){ return x.id===id; })[0];
    if (c){
      var n = document.getElementById("custNameInput"); if (n) n.value = c.name;
      var ph = document.getElementById("custPhoneInput"); if (ph) ph.value = c.phone||"";
    }
    render();
  },
  setPaymentType: function(v){ ui.paymentType=v; render(); },
  completeSale: function(){
    var lines = cartLines();
    if (lines.length===0) return;
    var total = lines.reduce(function(a,l){ return a+l.lineTotal; },0);
    var cost = lines.reduce(function(a,l){ return a+l.lineCost; },0);
    var profit = total-cost;
    if (ui.paymentType==="Udhaar" && !ui.customerId) return;
    var custName = val("custNameInput");
    var custPhone = val("custPhoneInput");
    var sale = {
      id: uid(),
      invoiceNo: "INV-"+String(db.sales.length+1).padStart(5,"0"),
      date: todayISO(),
      time: nowTime(),
      ts: Date.now(),
      items: lines.map(function(l){ return { productId:l.productId, name:l.product.name, qty:l.qty, price:l.product.salePrice, cost:l.product.purchasePrice }; }),
      total: total, cost: cost, profit: profit,
      customerId: ui.customerId || null,
      customerName: custName || "",
      customerPhone: custPhone || "",
      paymentType: ui.paymentType
    };
    db.sales.unshift(sale);
    db.products = db.products.map(function(p){
      var line = lines.filter(function(l){ return l.productId===p.id; })[0];
      return line ? Object.assign({}, p, { stock: p.stock-line.qty }) : p;
    });
    saveDB();
    ui.doneSale = sale;
    ui.cart = [];
    ui.customerId = "";
    ui.paymentType = "Cash";
    ui.pendingCustName = "";
    ui.pendingCustPhone = "";
    render();
  },
  newSale: function(){ ui.doneSale=null; ui.billingView="cart"; render(); },
  exportJPG: function(){ if (ui.doneSale) exportBillJPGCanvas(ui.doneSale); },

  viewBill: function(id){
    var s = db.sales.filter(function(x){ return x.id===id; })[0];
    if (s) ui.doneSale = s;
    render();
  },
  holdSale: function(){
    var lines = cartLines();
    if (lines.length===0) return;
    var held = {
      id: uid(),
      createdAt: Date.now(),
      cart: ui.cart.slice(),
      customerId: ui.customerId||"",
      customerName: val("custNameInput")||"",
      customerPhone: val("custPhoneInput")||"",
      paymentType: ui.paymentType
    };
    db.heldSales.unshift(held);
    saveDB();
    ui.cart = [];
    ui.customerId = "";
    ui.paymentType = "Cash";
    ui.billingView = "held";
    render();
  },
  resumeHeldSale: function(id){
    var h = db.heldSales.filter(function(x){ return x.id===id; })[0];
    if (!h) return;
    ui.cart = h.cart.slice();
    ui.customerId = h.customerId||"";
    ui.pendingCustName = h.customerName||"";
    ui.pendingCustPhone = h.customerPhone||"";
    ui.paymentType = h.paymentType||"Cash";
    db.heldSales = db.heldSales.filter(function(x){ return x.id!==id; });
    saveDB();
    ui.billingView = "cart";
    render();
  },
  deleteHeldSale: function(id){
    db.heldSales = db.heldSales.filter(function(x){ return x.id!==id; });
    saveDB();
    render();
  },

  openModal: function(name, productId){ ui.modal=name; ui.modalData = productId ? { productId:productId } : {}; render(); },
  closeModal: function(){ ui.modal=null; ui.modalData={}; render(); },

  saveNewProduct: function(){
    var name = val("m_name"); if (!name) return;
    db.products.push({
      id: uid(), name: name, category: val("m_category")||db.categories[0]||"General",
      purchasePrice: num("m_pp"), salePrice: num("m_sp"),
      stock: num("m_stock"), reorderLevel: num("m_reorder")||5
    });
    saveDB(); ui.modal=null; render();
  },
  saveEditProduct: function(){
    var pid = ui.modalData.productId;
    var name = val("m_name"); if (!name) return;
    db.products = db.products.map(function(p){
      return p.id===pid ? Object.assign({}, p, {
        name: name, category: val("m_category")||p.category,
        purchasePrice: num("m_pp"), salePrice: num("m_sp"),
        stock: num("m_stock"), reorderLevel: num("m_reorder")||p.reorderLevel
      }) : p;
    });
    saveDB(); ui.modal=null; render();
  },
  deleteProduct: function(pid){
    if (!confirm("Kya aap waqai is product ko delete karna chahte hain?")) return;
    db.products = db.products.filter(function(p){ return p.id!==pid; });
    saveDB(); render();
  },
  addCategory: function(){
    var name = val("m_newcat"); if (!name) return;
    if (db.categories.indexOf(name)>=0) return;
    db.categories.push(name);
    saveDB(); render();
  },
  renameCategory: function(i){
    var oldName = db.categories[i];
    var newName = val("cat_"+i);
    if (!newName || newName===oldName) return;
    db.categories[i] = newName;
    db.products = db.products.map(function(p){ return p.category===oldName ? Object.assign({}, p, { category:newName }) : p; });
    saveDB(); render();
  },
  deleteCategory: function(name){
    var inUse = db.products.some(function(p){ return p.category===name; });
    if (inUse){ alert("Pehle is category ke products ki category badlein, phir delete karein."); return; }
    if (!confirm("Kya category '"+name+"' delete karni hai?")) return;
    db.categories = db.categories.filter(function(c){ return c!==name; });
    saveDB(); render();
  },
  saveStock: function(){
    var pid = ui.modalData.productId;
    var p = db.products.filter(function(x){ return x.id===pid; })[0];
    if (!p) return;
    var qty = num("m_qty"); if (!qty) return;
    var price = num("m_price") || p.purchasePrice;
    var total = qty*price;
    var supplierId = val("m_supplier");
    var paymentType = val("m_payment") || "Cash";
    db.products = db.products.map(function(x){ return x.id===pid ? Object.assign({}, x, { stock:x.stock+qty, purchasePrice:price }) : x; });
    db.stockIns.unshift({ id:uid(), date:todayISO(), ts:Date.now(), productId:pid, qty:qty, price:price, total:total, supplierId: supplierId||null, paymentType:paymentType });
    saveDB(); ui.modal=null; render();
  },

  setKhataMode: function(m){ ui.khataMode=m; ui.khataSelected=null; render(); },
  openKhataDetail: function(id){ ui.khataSelected=id; render(); },
  closeKhataDetail: function(){ ui.khataSelected=null; render(); },
  saveNewEntity: function(){
    var name = val("m_name"); if (!name) return;
    var entity = { id:uid(), name:name, phone:val("m_phone"), opening:num("m_opening") };
    if (ui.khataMode==="customers") db.customers.push(entity); else db.suppliers.push(entity);
    saveDB(); ui.modal=null; render();
  },
  savePayment: function(){
    var amt = num("m_amount"); if (!amt) return;
    var notes = val("m_notes");
    if (ui.khataMode==="customers"){
      db.customerPayments.unshift({ id:uid(), date:todayISO(), ts:Date.now(), customerId:ui.khataSelected, amount:amt, notes:notes });
    } else {
      db.supplierPayments.unshift({ id:uid(), date:todayISO(), ts:Date.now(), supplierId:ui.khataSelected, amount:amt, notes:notes });
    }
    saveDB(); ui.modal=null; render();
  },

  setChartPeriod: function(p){ ui.chartPeriod=p; render(); },
  setReportPeriod: function(p){ ui.reportPeriod=p; render(); },
  saveIncomeExpense: function(){
    var amt = num("m_amount2"); var cat = val("m_category2");
    if (!amt || !cat) return;
    db.incomeExpense.unshift({ id:uid(), date: val("m_date")||todayISO(), type: val("m_type"), category:cat, desc: val("m_desc"), amount:amt });
    saveDB(); ui.modal=null; render();
  },

  saveSyncUrl: function(v){ localStorage.setItem(SYNC_URL_KEY, v); },
  toggleAutoSync: function(){
    var cur = localStorage.getItem(SYNC_AUTO_KEY)==="1";
    localStorage.setItem(SYNC_AUTO_KEY, cur ? "0" : "1");
    var el = document.getElementById("autoToggle");
    if (el) el.classList.toggle("on");
  },
  syncPush: syncPush,
  syncPull: syncPull
};

render();
})();
</script>
</body>
</html>
